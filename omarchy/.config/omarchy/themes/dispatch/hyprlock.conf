$color = rgba(10, 14, 23, 1)
$inner_color = rgba(10, 14, 23, 0.88)
$outer_color = rgba(58, 63, 75, 1)
$font_color = rgba(224, 228, 236, 1)
$placeholder_color = rgba(224, 228, 236, 0.6)
$check_color = rgba(30, 144, 255, 1)
$fail_color = rgba(220, 20, 60, 1)

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.5
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $check_color
    inner_color = $inner_color
    font_color = $font_color
    fade_on_empty = false
    placeholder_text = <span foreground="##e0e4ec80">Password...</span>
    hide_input = false
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <span foreground="##dc143c">Access Denied</span>
    fail_transition = 300
    capslock_color = $check_color
    numlock_color = $check_color
    bothlock_color = $check_color
    invert_numlock = false
    swap_font_color_with_shadow = false
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000055)
    shadow_offset = 0 2
    position = 0, -120
    halign = center
    valign = center
}

shape {
    monitor =
    size = 340, 140
    color = $inner_color
    rounding = 12
    border_size = 2
    border_color = $check_color
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $font_color
    font_size = 52
    font_family = monospace
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $placeholder_color
    font_size = 16
    font_family = monospace
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾  Locked
    color = $check_color
    font_size = 14
    font_family = monospace
    position = 0, 160
    halign = center
    valign = center
}
