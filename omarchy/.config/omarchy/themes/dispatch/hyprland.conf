$activeBorderColor = rgba(1e90ffee) rgba(ff8c00f2) rgba(7b68eed6) 135deg
$inactiveBorderColor = rgba(3a3f4ba8)
$groupInactiveBorderColor = rgba(3a3f4b82)
$activeGroupbarColor = rgba(0a0e17ec) rgba(1e90ff40) 135deg
$inactiveGroupbarColor = rgba(0a0e17b8)
$lockedActiveGroupbarColor = rgba(7b68ee45)
$lockedInactiveGroupbarColor = rgba(3a3f4b55)
$groupbarTextColor = rgb(e0e4ec)
$groupbarTextColorInactive = rgba(e0e4ecaa)
$activeShadowColor = rgba(1e90ff42)
$inactiveShadowColor = rgba(0a0e1724)

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $groupInactiveBorderColor

    groupbar {
        enabled = true
        blur = true
        gradients = true
        stacked = false
        height = 24
        gaps_in = 4
        gaps_out = 0
        indicator_height = 2
        indicator_gap = 4
        font_family = monospace
        font_size = 11
        font_weight_active = bold
        font_weight_inactive = normal
        text_color = $groupbarTextColor
        text_color_inactive = $groupbarTextColorInactive
        col.active = $activeGroupbarColor
        col.inactive = $inactiveGroupbarColor
        col.locked_active = $lockedActiveGroupbarColor
        col.locked_inactive = $lockedInactiveGroupbarColor
        gradient_rounding = 8
        gradient_rounding_power = 2
    }
}

decoration {
    rounding = 10
    rounding_power = 2
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.06
    dim_special = 0.12

    blur {
        enabled = true
        size = 6
        passes = 4
        special = true
        popups = true
        input_methods = true
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 0.92
        brightness = 0.85
        vibrancy = 0.06
        vibrancy_darkness = 0.3
        popups_ignorealpha = 0.55
        input_methods_ignorealpha = 0.55
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        offset = 2 4
        color = $activeShadowColor
        color_inactive = $inactiveShadowColor
    }
}

animations {
    enabled = true

    bezier = dispatchSnap, 0.16, 0.90, 0.20, 1.0
    bezier = dispatchFloat, 0.22, 0.80, 0.18, 1.0
    bezier = dispatchFade, 0.36, 0.0, 0.12, 1.0
    bezier = dispatchSlide, 0.18, 0.94, 0.28, 1.0

    animation = global, 1, 8, dispatchSnap
    animation = windows, 1, 5, dispatchFloat
    animation = windowsIn, 1, 5, dispatchSnap, popin 12%
    animation = windowsOut, 1, 4, dispatchFade, popin 82%
    animation = windowsMove, 1, 5, dispatchFloat
    animation = border, 1, 6, dispatchFade
    animation = borderangle, 1, 10, linear, once
    animation = fade, 1, 4, dispatchFade
    animation = fadeIn, 1, 4, dispatchFade
    animation = fadeOut, 1, 3, dispatchFade
    animation = layers, 1, 5, dispatchSlide, slidefade
    animation = layersIn, 1, 5, dispatchSnap, slidefade
    animation = layersOut, 1, 4, dispatchFade, fade
    animation = workspaces, 1, 4, dispatchSlide, slidefade
    animation = specialWorkspace, 1, 4, dispatchSlide, slidevert
}
