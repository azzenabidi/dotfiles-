[colors]
background = "#0a0e17"
foreground = "#e0e4ec"

[colors.cursor]
text = "#0a0e17"
cursor = "#1e90ff"

[colors.normal]
black   = "#0a0e17"
red     = "#dc143c"
green   = "#20b2aa"
yellow  = "#ff8c00"
blue    = "#1e90ff"
magenta = "#7b68ee"
cyan    = "#00ced1"
white   = "#e0e4ec"

[colors.bright]
black   = "#3a3f4b"
red     = "#ff4466"
green   = "#40d2c8"
yellow  = "#ffa040"
blue    = "#4aa8ff"
magenta = "#9b8aff"
cyan    = "#40e8e8"
white   = "#c0c8d8"

[window]
padding = { x = 8, y = 8 }
opacity = 0.92
